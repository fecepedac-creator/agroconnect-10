name: Security Guardrails

on:
  pull_request:
    branches:
      - fix/restore-agroconnect
      - main
      - 'release/*'
  push:
    branches:
      - fix/restore-agroconnect
      - 'codex/*'
      - 'release/*'

jobs:
  security-scan:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Scan current tree on branch pushes
        if: github.event_name == 'push'
        shell: pwsh
        run: .\ops\security-scan.ps1 -SkipHistory

      - name: Scan current tree and Git history before protected merges
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: .\ops\security-scan.ps1

      - name: Audit production dependencies
        shell: pwsh
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix functions audit --omit=dev --audit-level=high
