name: Daily Ops

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  daily-run:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run daily ops script
        shell: pwsh
        run: .\ops\daily-run.ps1

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-ops-report
          path: docs/reports/*.md
