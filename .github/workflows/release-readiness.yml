name: Release Readiness

on:
  workflow_dispatch:

jobs:
  readiness:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run frontend checks
        shell: pwsh
        run: |
          npm ci
          npm run lint
          npm run build
          npm run test:rules

      - name: Validate Firebase environment separation
        shell: pwsh
        env:
          FIREBASE_PROJECT_ID_DEV: ${{ secrets.FIREBASE_PROJECT_ID_DEV }}
          FIREBASE_PROJECT_ID_STAGING: ${{ secrets.FIREBASE_PROJECT_ID_STAGING }}
          FIREBASE_PROJECT_ID_PROD: ${{ secrets.FIREBASE_PROJECT_ID_PROD }}
        run: npm run check:firebase-envs

      - name: Audit production dependencies
        shell: pwsh
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix functions audit --omit=dev --audit-level=high

      - name: Run functions checks
        shell: pwsh
        run: |
          Push-Location functions
          npm ci
          $env:ESLINT_USE_FLAT_CONFIG = "false"
          npm run lint
          npm test
          Pop-Location

      - name: Run isolated E2E
        shell: pwsh
        run: |
          npx playwright install chromium
          npm run test:e2e:emulated

      - name: Run strict security scan
        shell: pwsh
        env:
          FIREBASE_PROJECT_ID_DEV: ${{ secrets.FIREBASE_PROJECT_ID_DEV }}
          FIREBASE_PROJECT_ID_STAGING: ${{ secrets.FIREBASE_PROJECT_ID_STAGING }}
          FIREBASE_PROJECT_ID_PROD: ${{ secrets.FIREBASE_PROJECT_ID_PROD }}
        run: .\ops\security-scan.ps1 -RequireEnvMapping
