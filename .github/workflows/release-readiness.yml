name: Release Readiness

on:
  workflow_dispatch:

jobs:
  readiness:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run frontend checks
        shell: pwsh
        run: |
          npm ci
          npm run lint
          npm run build
          npm run test:rules

      - name: Run functions checks
        shell: pwsh
        run: |
          Push-Location functions
          npm ci
          $env:ESLINT_USE_FLAT_CONFIG = "false"
          npm run lint
          npm test
          Pop-Location

      - name: Run strict security scan
        shell: pwsh
        run: .\ops\security-scan.ps1 -RequireEnvMapping
