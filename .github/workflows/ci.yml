name: CI Checks

on:
  pull_request:
    branches:
      - main
      - 'release/*'
  push:
    branches:
      - 'codex/*'
      - 'release/*'

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install frontend deps
        run: npm ci

      - name: Run Firestore rules tests
        run: npm run test:rules

  frontend:
    runs-on: ubuntu-latest
    needs: firestore-rules
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend deps
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  functions:
    runs-on: ubuntu-latest
    needs: firestore-rules
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install functions deps
        run: npm ci

      - name: Lint functions
        run: npm run lint

      - name: Build functions
        run: npm run build
