name: CI Checks

on:
  pull_request:
    branches:
      - main
      - 'release/*'
  push:
    branches:
      - fix/restore-agroconnect
      - 'codex/*'
      - 'release/*'

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install frontend deps
        run: npm ci

      - name: Run Firestore rules tests
        run: npm run test:rules

  frontend:
    runs-on: ubuntu-latest
    needs: firestore-rules
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend deps
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Enforce bundle budget
        run: npm run check:bundle

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: firestore-rules
    env:
      SUPERADMIN_EMAILS: superadmin@mundoconnect.test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npm --prefix functions ci
          npx playwright install --with-deps chromium

      - name: Configure emulator-only function parameters
        run: printf 'SUPERADMIN_EMAILS=%s\n' "$SUPERADMIN_EMAILS" > functions/.env.demo-mundoconnect

      - name: Run role and sector E2E
        run: npm run test:e2e:emulated

  functions:
    runs-on: ubuntu-latest
    needs: firestore-rules
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install functions deps
        run: npm ci

      - name: Lint functions
        run: ESLINT_USE_FLAT_CONFIG=false npm run lint

      - name: Build functions
        run: npm test

