name: CI Checks

on:
  pull_request:
    branches:
      - main
      - 'release/*'
  push:
    branches:
      - 'codex/*'
      - 'release/*'

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps
        run: npm install

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install functions deps
        run: npm install

      - name: Lint functions
        run: npm run lint

      - name: Build functions
        run: npm run build