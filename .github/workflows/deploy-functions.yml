name: Deploy Firebase Functions

on:
  push:
    branches:
      - main
      - 'release/*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: staging
        type: choice
        options:
          - dev
          - staging
          - prod

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Resolve target environment
        id: target
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV_NAME="${{ inputs.environment }}"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            ENV_NAME="prod"
          else
            ENV_NAME="staging"
          fi

          case "$ENV_NAME" in
            dev)
              PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID_DEV }}"
              SUPERADMIN_EMAILS="${{ secrets.SUPERADMIN_EMAILS_DEV }}"
              ;;
            staging)
              PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID_STAGING }}"
              SUPERADMIN_EMAILS="${{ secrets.SUPERADMIN_EMAILS_STAGING }}"
              ;;
            prod)
              PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID_PROD }}"
              SUPERADMIN_EMAILS="${{ secrets.SUPERADMIN_EMAILS_PROD }}"
              ;;
            *)
              echo "Unsupported environment: $ENV_NAME" >&2
              exit 1
              ;;
          esac

          if [[ -z "$PROJECT_ID" ]]; then
            echo "Missing Firebase project ID secret for $ENV_NAME" >&2
            exit 1
          fi

          if [[ -z "$SUPERADMIN_EMAILS" ]]; then
            echo "Missing SUPERADMIN_EMAILS secret for $ENV_NAME" >&2
            exit 1
          fi

          echo "environment=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"

          {
            echo "superadmin_emails<<EOF"
            echo "$SUPERADMIN_EMAILS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_AGROCONNECT_APP_420 }}'

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci

      - name: Install Firebase CLI
        run: npm i -g firebase-tools

      - name: Write Functions params for target project
        shell: bash
        run: |
          ENV_FILE="functions/.env.${{ steps.target.outputs.project_id }}"
          printf 'SUPERADMIN_EMAILS=%s\n' '${{ steps.target.outputs.superadmin_emails }}' > "$ENV_FILE"

      - name: Deploy Functions
        shell: bash
        run: |
          firebase deploy --only functions --project "${{ steps.target.outputs.project_id }}" --non-interactive

